<script src="https://js.paystack.co/v2/inline.js"></script><script>
function startPayment() {

  const email = document.getElementById("email").value.trim();

  if (!email) {
    alert("Please enter your email.");
    return;
  }

  if (typeof PaystackPop === "undefined") {
    alert("Paystack has not loaded. Refresh the page and try again.");
    return;
  }

  const paystack = new PaystackPop();

  paystack.newTransaction({
    key: "pk_test_1d46ca8bee80942378ee5558fcbc3f9b6dc4e805",
    email: email,
    amount: 200000,
    currency: "NGN",

    onSuccess: function(transaction) {
      alert("Test payment successful: " + transaction.reference);
    },

    onCancel: function() {
      alert("Payment cancelled.");
    }
  });
}
    </script>
