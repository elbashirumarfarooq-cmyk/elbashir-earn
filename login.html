<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My Reward App</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f4;
    }

    .container {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px;
    }

    h1 {
      color: #08752b;
      text-align: center;
      margin-top: 60px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #08752b;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .register {
      text-align: center;
      margin-top: 22px;
    }

    .register a {
      color: #08752b;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Welcome Back!</h1>

  <p class="subtitle">
    Login to access your account
  </p>

  <form onsubmit="login(event)">

    <label>Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

  <div class="register">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

</div>

<script>
function login(event) {
  event.preventDefault();

  const email = document.getElementById("email").value;
  const savedEmail = localStorage.getItem("userEmail");
const savedPassword = localStorage.getItem("userPassword");
  if if (
  email === savedEmail &&
  password === savedPassword
) {
    alert("Login successful!");
    window.location.href = "index.html";
  } else {
    alert("Account not found. Please register first.");
  }
}
</script>

</body>
</html>
