<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My Reward App</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f4;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px;
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-top: 40px;
    }

    h1 {
      text-align: center;
      color: #08752b;
      margin-top: 15px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #08752b;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #b00020;
    }

    .register {
      text-align: center;
      margin-top: 25px;
      color: #666;
    }

    .register a {
      color: #08752b;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">🔐</div>

  <h1>Welcome Back</h1>

  <p class="subtitle">
    Login to your My Reward App account
  </p>

  <form id="loginForm">

    <label>Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="register">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const savedEmail =
    localStorage.getItem("userEmail");

  const savedPassword =
    localStorage.getItem("userPassword");

  const message =
    document.getElementById("message");

  if (!savedEmail || !savedPassword) {

    message.textContent =
      "No account found. Please create an account first.";

    return;
  }

  if (email === savedEmail && password === savedPassword) {

    localStorage.setItem("loggedIn", "true");

    message.style.color = "#08752b";
    message.textContent = "Login successful...";

    setTimeout(function() {
      window.location.href = "index.html";
    }, 500);

  } else {

    message.textContent =
      "Incorrect email or password.";

  }

});

</script>

</body>
  </html>
