<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - My Reward App</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f4;
    }

    .container {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px;
    }

    h1 {
      color: #08752b;
      text-align: center;
      margin-top: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #08752b;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #08752b;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Create Account</h1>

  <p class="subtitle">
    Create your account to get started
  </p>

  <form onsubmit="createAccount(event)">

    <label>Full Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >

    <label>Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="Enter your phone number"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create a password"
      required
    >

    <button type="submit">
      Create Account
    </button>

  </form>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>
function createAccount(event) {
  event.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value;

  localStorage.setItem("userName", name);
  localStorage.setItem("userEmail", email);
  localStorage.setItem("userPhone", phone);
localStorage.setItem("userPassword", document.getElementById("password").value);
  alert("Account created successfully!");

  window.location.href = "login.html";
}
</script>

</body>
</html>
