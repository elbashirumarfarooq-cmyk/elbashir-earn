<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Activate Withdrawal</title>

  <script src="https://js.paystack.co/v2/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f4;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px;
    }

    h1 {
      color: #08752b;
      text-align: center;
      margin-top: 35px;
    }

    .card {
      margin-top: 25px;
      padding: 22px;
      background: #eef8ef;
      border-radius: 16px;
      text-align: center;
    }

    .amount {
      font-size: 32px;
      font-weight: bold;
      color: #08752b;
      margin: 20px 0;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #08752b;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #08752b;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🔐 Activate Withdrawal</h1>

  <div class="card">

    <p>Activation fee</p>

    <div class="amount">
      ₦2,000
    </div>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >

  <button type="button" id="payButton">
  💳 Continue to Payment
  </button>

  </div>

  <a href="index.html" class="back">
    ← Back to Dashboard
  </a>

</div>

<script>

function payNow() {

  const email =
    document.getElementById("email").value.trim();

  if (!email) {
    alert("Please enter your email.");
    return;
  }

  const popup = new Paystack();

  popup.checkout({

    key: "pk_test_1d46ca8bee80942378ee5558fcbc3f9b6dc4e805

    email: email,

    amount: 200000,

    currency: "NGN",

    onSuccess: function(transaction) {

      /*
       * TEST ONLY.
       * Do not treat this frontend callback as
       * proof of payment in a production app.
       */

      alert(
        "Payment completed in test mode. Reference: " +
        transaction.reference
      );

      window.location.href = "verify.html";
    },

    onCancel: function() {

      alert("Payment cancelled.");

    },

    onError: function(error) {

      alert(
        "Payment error: " +
        error.message
      );

    }

  });

}
<script>
document.getElementById("payButton").addEventListener("click", function () {

  const email = document.getElementById("email").value.trim();

  if (!email) {
    alert("Please enter your email.");
    return;
  }

  if (typeof PaystackPop === "undefined") {
    alert("Paystack library did not load.");
    return;
  }

  const popup = new PaystackPop();

  popup.newTransaction({
    key: "pk_test_1d46ca8bee80942378ee5558fcbc3f9b6dc4e805",
    email: email,
    amount: 200000,
    currency: "NGN",

    onLoad: function () {
      console.log("Paystack checkout loaded");
    },

    onSuccess: function (transaction) {
      alert("Test payment successful: " + transaction.reference);
    },

    onCancel: function () {
      alert("Payment cancelled");
    },

    onError: function (error) {
      alert("Paystack error: " + error.message);
    }
  });

});
</script>
</script>

</body>
  </html>
