<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f4;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px;
    }

    h1 {
      color: #08752b;
      text-align: center;
    }

    .card {
      margin-top: 25px;
      padding: 20px;
      border-radius: 16px;
      background: #eef8ef;
    }

    .row {
      padding: 15px 0;
      border-bottom: 1px solid #d5e5d7;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      font-size: 13px;
      color: #666;
    }

    .value {
      margin-top: 5px;
      font-weight: bold;
      font-size: 17px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      padding: 14px;
      background: #08752b;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>My Account</h1>

  <div class="card">

    <div class="row">
      <div class="label">Full Name</div>
      <div class="value" id="name">Loading...</div>
    </div>

    <div class="row">
      <div class="label">Email Address</div>
      <div class="value" id="email">Loading...</div>
    </div>

    <div class="row">
      <div class="label">Phone Number</div>
      <div class="value" id="phone">Loading...</div>
    </div>

    <div class="row">
      <div class="label">Account Status</div>
      <div class="value">🟢 Active</div>
    </div>

  </div>

  <a class="back" href="index.html">
    Back to Dashboard
  </a>

</div>

<script>
  document.getElementById("name").textContent =
    localStorage.getItem("userName") || "Not available";

  document.getElementById("email").textContent =
    localStorage.getItem("userEmail") || "Not available";

  document.getElementById("phone").textContent =
    localStorage.getItem("userPhone") || "Not available";
</script>

</body>
  </html>
