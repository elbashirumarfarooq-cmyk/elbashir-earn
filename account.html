<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f4;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px;
    }

    h1 {
      text-align: center;
      color: #08752b;
    }

    .profile {
      text-align: center;
      background: #eef8ef;
      padding: 25px;
      border-radius: 16px;
      margin-top: 20px;
    }

    .avatar {
      font-size: 55px;
    }

    .name {
      font-size: 23px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status {
      color: #08752b;
      margin-top: 8px;
    }

    .item {
      margin-top: 15px;
      padding: 16px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    .item strong {
      display: block;
      margin-bottom: 5px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      padding: 14px;
      background: #08752b;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>👤 My Account</h1>

  <div class="profile">

    <div class="avatar">👤</div>

    <div class="name">
      ElBashir Umar Farooq
    </div>

    <div class="status">
      🟢 Account Active
    </div>

  </div>

  <div class="item">
    <strong>💰 Reward Balance</strong>
    ₦20,000
  </div>

  <div class="item">
    <strong>🔐 Withdrawal Status</strong>
    Available for demo withdrawal
  </div>

  <div class="item">
    <strong>📋 Transaction History</strong>
    View your withdrawal requests from the History page.
  </div>

  <a href="history.html" class="back">
    📋 View History
  </a>

  <a href="index.html" class="back">
    ← Back to Dashboard
  </a>

</div>

</body>
  </html>
