<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Withdrawal</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f7f4;
      padding: 20px;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      color: #08752b;
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background: #08752b;
      color: white;
      border: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>💸 Withdrawal</h1>

  <h2>Balance: ₦20,000</h2>

  <select id="bank">
    <option value="">Select Bank</option>
    <option>Access Bank</option>
    <option>First Bank</option>
    <option>GTBank</option>
    <option>UBA</option>
    <option>Zenith Bank</option>
    <option>OPay</option>
    <option>PalmPay</option>
  </select>

  <input
    id="account"
    type="text"
    maxlength="10"
    placeholder="10-digit account number"
  >

  <input
    id="amount"
    type="number"
    placeholder="Amount"
  >

  <button onclick="withdraw()">
    💸 Request Withdrawal
  </button>

  <br><br>

  <a href="history.html">
    📋 View History
  </a>

</div>

<script>

function withdraw() {

  const bank = document.getElementById("bank").value;
  const account = document.getElementById("account").value;
  const amount = document.getElementById("amount").value;

  if (bank === "") {
    alert("Please select your bank.");
    return;
  }

  if (account.length !== 10) {
    alert("Enter a 10-digit account number.");
    return;
  }

  if (amount === "") {
    alert("Enter withdrawal amount.");
    return;
  }

  let history = JSON.parse(
    localStorage.getItem("withdrawalHistory") || "[]"
  );

  history.push({
    bank: bank,
    account: account,
    amount: amount,
    status: "Pending",
    date: new Date().toLocaleString()
  });

  localStorage.setItem(
    "withdrawalHistory",
    JSON.stringify(history)
  );

  alert("Withdrawal request saved as Pending.");

  window.location.href = "history.html";
}

</script>

</body>
  </html>
