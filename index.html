<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration & Activation</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.container{
  width:90%;
  max-width:420px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px #ccc;
}
h2{text-align:center}
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:16px;
}
.page{display:none}
.page.active{display:block}
.details{
  background:#f5f5f5;
  padding:18px;
  border-radius:10px;
  line-height:2;
  margin-top:15px;
}
.amount{
  text-align:center;
  font-size:28px;
  font-weight:bold;
}
.error{
  color:red;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- REGISTER -->
<div id="register" class="page active">
<h2>📝 Register</h2>

<input id="name" type="text" placeholder="Full Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
</div>


<!-- ACTIVATION -->
<div id="activation" class="page">
<h2>🔐 Activation</h2>

<p style="text-align:center">
Enter your activation code
</p>

<input id="activationCode"
       type="text"
       placeholder="Activation Code">

<button onclick="activate()">Continue</button>

<div id="error" class="error"></div>
</div>


<!-- PAYMENT DETAILS -->
<div id="payment" class="page">

<h2>💳 Payment Details</h2>

<div class="amount">₦2,000</div>

<div class="details">
<b>Account Name:</b><br>
Bashar Umar<br>

<b>Account Number:</b><br>
5982626313<br>

<b>Bank:</b><br>
Moniepoint MFB
</div>

<p style="text-align:center">
Please transfer exactly ₦2,000 to the account above.
</p>

<button onclick="confirmPayment()">
I Have Paid
</button>

<p id="confirmed"
   style="display:none;color:green;text-align:center">
✅ Payment submitted successfully.
</p>

</div>

</div>


<script>

const ACTIVATION_CODE =
"ELBASHIR-2026-UMAR-FAROQ-84721";


function showPage(page){

  document.querySelectorAll(".page")
  .forEach(p => p.classList.remove("active"));

  document.getElementById(page)
  .classList.add("active");
}


function register(){

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!name || !email || !password){

    alert("Please complete all fields.");

    return;
  }

  showPage("activation");
}


function activate(){

  const code =
    document.getElementById("activationCode")
    .value.trim();

  if(code === ACTIVATION_CODE){

    showPage("payment");

  }else{

    document.getElementById("error")
    .textContent =
    "Invalid activation code. Please try again.";

  }
}


function confirmPayment(){

  document.getElementById("confirmed")
  .style.display="block";

}

</script>

</body>
</html>
