<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Activation</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:92%;
  max-width:430px;
  background:#fff;
  padding:28px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.page{display:none}
.page.active{display:block}

h1{
  text-align:center;
  margin-bottom:10px;
}

p{
  text-align:center;
  color:#666;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.amount{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin:20px 0;
}

.details{
  background:#f1f5f9;
  padding:20px;
  border-radius:12px;
  line-height:2;
  font-size:16px;
}

.error{
  color:red;
  text-align:center;
  margin-top:12px;
}

.success{
  display:none;
  color:green;
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<!-- REGISTER -->
<div id="register" class="page active">

<h1>📝 Create Account</h1>
<p>Register to continue</p>

<input id="name" type="text" placeholder="Full Name">

<input id="email" type="email" placeholder="Email Address">

<input id="password" type="password" placeholder="Password">

<button onclick="registerUser()">
Register
</button>

</div>


<!-- ACTIVATION -->
<div id="activation" class="page">

<h1>🔐 Activation</h1>
<p>Enter your activation code</p>

<input
id="activationCode"
type="text"
placeholder="Activation Code">

<button onclick="checkCode()">
Activate
</button>

<div id="error" class="error"></div>

</div>


<!-- PAYMENT -->
<div id="payment" class="page">

<h1>💳 Payment</h1>

<p>Activation successful</p>

<div class="amount">
₦2,000
</div>

<div class="details">

<b>Account Name:</b><br>
Bashar Umar

<br>

<b>Account Number:</b><br>
5982626313

<br>

<b>Bank:</b><br>
Moniepoint MFB

</div>

<p>
Please transfer exactly ₦2,000 to the account details above.
</p>

<button onclick="confirmPayment()">
I Have Paid
</button>

<div id="success" class="success">
✅ Payment submitted successfully.
</div>

</div>

</div>


<script>

const ACTIVATION_CODE =
"ELBASHIR-2026-UMAR-FAROQ-84721";


function showPage(page){

document
.querySelectorAll(".page")
.forEach(function(p){
p.classList.remove("active");
});

document
.getElementById(page)
.classList.add("active");

}


function registerUser(){

const name =
document.getElementById("name").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!name || !email || !password){

alert("Please complete all registration fields.");

return;

}

showPage("activation");

}


function checkCode(){

const code =
document
.getElementById("activationCode")
.value.trim();

if(code === ACTIVATION_CODE){

document.getElementById("error").textContent="";

showPage("payment");

}else{

document.getElementById("error").textContent =
"Invalid activation code.";

}

}


function confirmPayment(){

document
.getElementById("success")
.style.display="block";

}

</script>

</body>
</html>
